name: financial-harness

x-app: &app
  build:
    context: .
    target: app
  image: financial-harness:local
  environment:
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/1
  depends_on:
    redis:
      condition: service_healthy

services:
  api:
    <<: *app
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:8000"

  worker:
    <<: *app
    command: ["celery", "-A", "stock_assistant.tasks:celery_app", "worker", "--loglevel=INFO", "--concurrency=1"]
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      ALPHAVANTAGE_API_KEY: ${ALPHAVANTAGE_API_KEY:-demo}
      STOCK_DATA_MODE: ${STOCK_DATA_MODE:-auto}
    depends_on:
      redis:
        condition: service_healthy
      sandbox:
        condition: service_healthy
    volumes:
      - sandbox-ipc:/sandbox-ipc

  sandbox:
    build:
      context: .
      target: sandbox
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 32
    volumes:
      - sandbox-ipc:/sandbox-ipc
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(socket.AF_UNIX); s.connect('/sandbox-ipc/analysis.sock'); s.close()"]
      interval: 5s
      timeout: 2s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10
    volumes:
      - redis-data:/data

volumes:
  sandbox-ipc:
  redis-data:
